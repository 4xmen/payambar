<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  
  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Soft Emerald Glow -->
  <circle cx="380" cy="130" r="150" fill="#10b981" opacity="0.14"/>
  
  <!-- Main Speech Bubble Shadow & Body -->
  <g filter="url(#shadow)">
    <path d="M140 130 C140 106 160 86 184 86 H328 C352 86 372 106 372 130 V266 C372 290 352 310 328 310 H220 L155 365 C146 373 140 366 140 355 V310 H184 C160 310 140 290 140 266 Z" fill="#ffffff"/>
    
    <!-- Secure Lock Symbol -->
    <!-- Shackle -->
    <path d="M228 200 V168 C228 152.5 240.5 140 256 140 C271.5 140 284 152.5 284 168 V200" stroke="#10b981" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Lock Box -->
    <rect x="210" y="196" width="92" height="74" rx="18" fill="url(#lockGrad)"/>
    <!-- Keyhole -->
    <circle cx="256" cy="226" r="7" fill="#ffffff"/>
    <path d="M256 232 V248" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
